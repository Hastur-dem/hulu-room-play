<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'self'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>呼噜小屋 · 好友试玩</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f5ec;color:#344537;font:17px/1.65 system-ui,sans-serif;min-height:100vh;min-height:100svh;display:grid;place-items:center}main{max-width:26rem;padding:28px;text-align:center}h1{font:600 32px/1.2 Georgia,"Songti SC",serif}progress{accent-color:#475f49;width:100%;height:6px}button{border:0;border-radius:20px;background:#405b43;color:white;font:inherit;padding:6px 20px;cursor:pointer}
  </style>
</head>
<body>
<main><h1>呼噜小屋</h1><p id="state" role="status">请用朋友发来的完整链接打开试玩。</p><progress hidden id="progress"></progress><button hidden id="retry">重新载入</button></main>
<script>
(async () => {
    let key;
  function importInvite() {
    const text = location.hash.slice(1);
    if (!/^[A-Za-z0-9_-]{43}$/.test(text)) throw Error('无效的试玩链接');
    if (!key) {
      const bytes = Uint8Array.from(atob(text.replace(/-/g, '+').replace(/_/g, '/') + '='), c => c.charCodeAt(0));
      key = crypto.subtle.importKey('raw', bytes, 'AES-GCM', false, ['decrypt']);
    }
    return key;
  }

  async function openPacket(file, allowed, progress, signals = []) {
    if (!allowed.has(file)) throw Error('未知资源');
    const url = new URL('./' + file, location.href);
    if (url.origin !== location.origin) throw Error('资源域名无效');
    for (let attempt = 0; ; attempt++) {
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const cancelled = () => signals.some(signal => signal.aborted);
      if (cancelled()) throw new DOMException('Scene closed','AbortError');
      const abort = () => ctrl?.abort();
      for (const signal of signals) signal.addEventListener('abort',abort,{once:true});
      let timeout;
      function arm(ms) {
        clearTimeout(timeout);
        if (ctrl) timeout = setTimeout(() => ctrl.abort(), ms);
      }
      try {
        if (progress) progress.removeAttribute('value');
        arm(75000);
        const options = {mode:'same-origin', credentials:'omit', redirect:'error', referrerPolicy:'no-referrer'};
        if (ctrl) options.signal = ctrl.signal;
        if (attempt) options.cache = 'reload';
        const response = await fetch(url.href, options);
        if (!response.ok) throw Error('HTTP ' + response.status);
        let bytes;
        if (progress && response.body && typeof response.body.getReader === 'function') {
          const reader = response.body.getReader(), chunks = [];
          const total = Number(response.headers.get('content-length'));
          if (total > 0) progress.max = total;
          let length = 0;
          while (true) {
            const part = await reader.read();
            if (part.done) break;
            chunks.push(part.value);
            length += part.value.byteLength;
            arm(75000);
            if (total > 0) progress.value = length;
          }
          bytes = new Uint8Array(length);
          let offset = 0;
          for (const chunk of chunks) {bytes.set(chunk, offset); offset += chunk.byteLength;}
        } else {
          arm(300000);
          bytes = new Uint8Array(await response.arrayBuffer());
        }
        if (bytes.length < 29) throw Error('资源不完整');
        const params = {name:'AES-GCM', iv:bytes.subarray(0,12), additionalData:new TextEncoder().encode(file)};
        return await crypto.subtle.decrypt(params, await importInvite(), bytes.subarray(12));
      } catch (error) {
        if (attempt || cancelled()) throw error;
        await new Promise(resolve => setTimeout(resolve, 450));
      } finally {
        clearTimeout(timeout);
        for (const signal of signals) signal.removeEventListener('abort',abort);
      }
    }
  }

  if (!/^[A-Za-z0-9_-]{43}$/.test(location.hash.slice(1))) return;
  const state = document.getElementById('state'), progress = document.getElementById('progress');
  document.getElementById('retry').onclick = () => location.reload();
  try {
    state.textContent = '正在打开小屋…';
    progress.hidden = false;
    const names = ["start-9a39103cce461f9b.bin","compat-4ae293fa5c563146.bin"];
    const mode = new URLSearchParams(location.search).get('play');
    const previewIds = mode === 'wildcats' ? ['snow-leopard','lion','jaguar'] : mode === 'bigcats' ? ['tiger','cheetah'] : null;
    const posters = {"orange":"cat-7e1ec4f7d6b4aaea.bin","tiger":"pond-65f18db7086d7b4b.bin","cheetah":"cheetah-78457792b18e3008.bin","snow-leopard":"snow-leopard-26775461b7b9996e.bin","lion":"lion-4abeb0b8759637fc.bin","jaguar":"jaguar-91bccb88feb8fa39.bin"};
    let lastAnimal;
    try {
      const key = mode === 'wildcats' ? 'purr-room-wildcats-v1' : mode === 'bigcats' ? 'purr-room-bigcats-v1' : 'purr-room-juzi-v1';
      lastAnimal = JSON.parse(localStorage.getItem(key))?.selected;
    } catch {}
    const first = previewIds ? (previewIds.includes(lastAnimal) ? lastAnimal : previewIds[0]) : (lastAnimal || 'orange');
    if (Object.prototype.hasOwnProperty.call(posters, first)) {
      const file = posters[first];
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      window.huluFirstPhoto = {file,controller, result:openPacket(file,new Set([file]),null,controller ? [controller.signal] : [])
        .then(bytes => ({bytes}), error => ({error}))};
    }
    const compressed = typeof DecompressionStream === 'function' && typeof Blob.prototype.stream === 'function'
      && typeof ReadableStream === 'function' && typeof ReadableStream.prototype.pipeThrough === 'function';
    const bytes = await openPacket(names[compressed ? 0 : 1], new Set(names), progress);
    const html = compressed ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      : new TextDecoder().decode(bytes);
    document.open(); document.write(html); document.close();
  } catch {
    window.huluFirstPhoto?.controller?.abort();
    delete window.huluFirstPhoto;
    progress.hidden = true;
    state.textContent = '载入失败。请检查网络，或重新打开朋友发来的完整链接。';
    document.getElementById('retry').hidden = false;
  }
})();
</script>
</body>
</html>
